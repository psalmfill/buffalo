# BUFFALO development overrides (loaded automatically by `docker compose`).
#
# Development relaxations only (Phase 8C.5): the base compose.yml carries
# the production hardening. All published ports bind to 127.0.0.1 only.
# Services that need a published port, Mailpit or the host (Xdebug) also
# join the `default` network, because the base networks have no gateway.

services:
  app:
    volumes:
      - .:/var/www/html
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    extra_hosts:
      - host.docker.internal:host-gateway
    networks: [default]

  horizon:
    volumes:
      - .:/var/www/html
    networks: [default]

  scheduler:
    volumes:
      - .:/var/www/html
    networks: [default]

  reverb:
    volumes:
      - .:/var/www/html

  nginx:
    volumes:
      - .:/var/www/html:ro
    ports:
      - 127.0.0.1:${APP_PORT:-8000}:8080

  postgres:
    ports:
      - 127.0.0.1:${FORWARD_DB_PORT:-5432}:5432
    networks: [default]

  valkey:
    ports:
      - 127.0.0.1:${FORWARD_VALKEY_PORT:-6379}:6379
    networks: [default]

  mailpit:
    image: axllent/mailpit:v1.31.2@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports:
      - 127.0.0.1:${FORWARD_MAILPIT_UI_PORT:-8025}:8025
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      # No external requests from the Mailpit UI (version checks, etc.).
      MP_DISABLE_VERSION_CHECK: 1
      MP_BLOCK_REMOTE_CSS_AND_FONTS: 1

  vite:
    image: node:24.21.0-alpine3.24@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    user: ${DOCKER_UID:-1000}:${DOCKER_GID:-1000}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    working_dir: /app
    command: ["npm", "run", "dev"]
    restart: unless-stopped
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/.npm
      npm_config_update_notifier: "false"
      # The Wayfinder Vite plugin normally runs `php artisan wayfinder:generate`.
      # There is no PHP here, so it is a no-op; routes are generated in the app
      # container instead (`make wayfinder`).
      WAYFINDER_COMMAND: "true"
      VITE_DEV_SERVER_PORT: ${VITE_PORT:-5173}
    volumes:
      - .:/app
    ports:
      - 127.0.0.1:${VITE_PORT:-5173}:${VITE_PORT:-5173}
