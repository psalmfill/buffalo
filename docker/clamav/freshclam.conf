# freshclam configuration (Phase 8B.4, 8C.5), used only when
# CLAMAV_ONLINE_UPDATES=true (the container also needs a network with
# outbound access to the mirror then).
LogTime yes
DatabaseDirectory /var/lib/clamav
DatabaseMirror database.clamav.net
ScriptedUpdates yes
NotifyClamd /etc/clamav/clamd.conf
