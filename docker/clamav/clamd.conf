# clamd configuration (Phase 8B.4, 8C.5), mounted read-only: the container
# runs unprivileged (as clamav) with a read-only root filesystem, so the
# image's start-up edits (CLAMD_CONF_*) are replaced by this file.
Foreground yes
# No LogFile: in the foreground clamd logs to the container output
# (/dev/stdout is a symlink, which clamd refuses to open).
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
SelfCheck 600
# Above the largest evidence upload (100 MB video).
StreamMaxLength 160M
MaxFileSize 160M
MaxScanSize 400M
