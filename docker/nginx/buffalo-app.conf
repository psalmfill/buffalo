# BUFFALO application locations, shared by the development server
# (default.conf, plain HTTP) and the production TLS server
# (templates/default.conf.template). Included inside a server block.

# Maintenance mode (Phase 9A): scripts/ops/upgrade.sh creates the flag file
# on the `maintenance` volume; every request except nginx's own health check
# then gets a static 503 page.
set $buffalo_maintenance 0;
if (-f /var/lib/buffalo/maintenance/on) {
    set $buffalo_maintenance 1;
}
if ($uri = /nginx-ping) {
    set $buffalo_maintenance 0;
}
if ($buffalo_maintenance) {
    return 503;
}
error_page 503 @maintenance;
location @maintenance {
    root /usr/share/nginx/maintenance;
    rewrite ^ /maintenance.html break;
    add_header Retry-After 600 always;
    add_header Cache-Control "no-store" always;
}

root /var/www/html/public;
index index.php;
charset utf-8;

server_tokens off;

# Evidence uploads (Phase 5). Keep in step with php.ini upload limits.
client_max_body_size 100M;

# Security headers. "add_header_inherit merge" keeps them in locations
# that add headers of their own (expires adds Cache-Control).
add_header_inherit merge;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Deny hidden files (.env, .git, ...) everywhere.
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

# Container health check (Phase 8C.5): nginx itself, from inside only.
location = /nginx-ping {
    access_log off;
    allow 127.0.0.1;
    deny all;
    return 204;
}

location = /favicon.ico { access_log off; log_not_found off; }
location = /robots.txt  { access_log off; log_not_found off; }

# Laravel Reverb: WebSocket connections (/app/{key}) and the HTTP API
# (/apps/{id}/...). Trailing slashes keep application routes such as
# /appearance from matching.
location ^~ /app/ {
    set $reverb_upstream reverb:8080;
    proxy_pass http://$reverb_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

location ^~ /apps/ {
    set $reverb_upstream reverb:8080;
    proxy_pass http://$reverb_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Self-hosted PMTiles basemap. Same origin as the app, so no CORS headers
# are sent. nginx answers byte-range requests for static files natively;
# PMTiles readers depend on this.
location ^~ /tiles/ {
    alias /usr/share/nginx/tiles/;
    autoindex off;
    types {
        application/vnd.pmtiles pmtiles;
    }
    default_type application/octet-stream;
    max_ranges 64;
    gzip off;
    etag on;
    expires 30d;
    access_log off;
}

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# Detailed health JSON (Phase 8C.4): internal networks only, in addition
# to its bearer token. Monitoring on the public internet is refused here.
location = /health/detailed {
    allow 127.0.0.0/8;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
    try_files $uri /index.php?$query_string;
}

location = /index.php {
    set $php_upstream app:9000;
    fastcgi_pass $php_upstream;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    include fastcgi_params;
    # Tells Laravel the browser used HTTPS (TLS ends here; Phase 9A).
    fastcgi_param HTTPS $https if_not_empty;
    fastcgi_hide_header X-Powered-By;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
    fastcgi_read_timeout 120s;
}

# Only public/index.php may be executed.
location ~ \.php$ {
    return 404;
}

error_page 404 /index.php;
