# BUFFALO nginx: development server (plain HTTP on 8080 inside the
# container). Production uses templates/default.conf.template (TLS).

# Upstreams are resolved per request through Docker's embedded DNS, so a
# restarted app or reverb container (new IP) is picked up without reloading
# nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # Unprivileged nginx (Phase 8C.5): 8080 inside the container.
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    include /etc/nginx/buffalo/app.conf;
}
