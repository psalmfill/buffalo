; Overrides for the default "www" pool. FPM runs as the non-root "buffalo"
; user, so user/group directives are not needed.

[global]
daemonize = no

[www]
listen = 9000
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Used by the container healthcheck (cgi-fcgi against 127.0.0.1:9000).
ping.path = /ping
ping.response = pong

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
