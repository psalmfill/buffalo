# pgBackRest configuration (Phase 8C.1). Secrets never live here: cipher
# passphrases come from the environment (PGBACKREST_REPO1_CIPHER_PASS, set
# from a secret file by backup-entrypoint.sh). Repository 2 is added through
# the environment when BACKUP_REPO2_PATH is configured.

[global]
repo1-path=/backup/pgbackrest
repo1-cipher-type=aes-256-cbc
repo1-retention-full-type=count
compress-type=zst
process-max=2
start-fast=y
log-level-console=info
log-level-file=off
lock-path=/tmp/pgbackrest

[buffalo]
pg1-path=/var/lib/postgresql/18/docker
pg1-socket-path=/var/run/postgresql
