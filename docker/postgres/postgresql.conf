# BUFFALO PostgreSQL configuration (Phase 8C.1), mounted read-only and used
# with `-c config_file=`. The settings initdb wrote in the image are kept
# here so the whole configuration is in version control.

listen_addresses = '*'
max_connections = 100
shared_buffers = 128MB
dynamic_shared_memory_type = posix
max_wal_size = 1GB
min_wal_size = 80MB
autovacuum_worker_slots = 16

log_timezone = UTC
datestyle = 'iso, mdy'
timezone = UTC
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'

# --- Backups: continuous WAL archiving through pgBackRest -------------------
# The recovery point objective is 15 minutes: a WAL segment is archived as
# soon as it fills, and at least every 5 minutes when writes are light.
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=buffalo archive-push %p'
archive_timeout = 300
