# BUFFALO base services.
#
# No ports are published here. Development port bindings and source mounts
# live in compose.override.yml, which Docker Compose loads automatically.
# Every image is pinned to an exact version tag.

name: buffalo

x-app: &app
  image: buffalo-app:dev
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: dev
    args:
      UID: ${DOCKER_UID:-1000}
      GID: ${DOCKER_GID:-1000}
  depends_on:
    postgres:
      condition: service_healthy
    valkey:
      condition: service_healthy

services:
  app:
    <<: *app
    restart: unless-stopped
    volumes:
      - evidence_data:/var/lib/buffalo/evidence
    healthcheck:
      test:
        - CMD-SHELL
        - SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:1.30.5-alpine3.24
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      reverb:
        condition: service_started
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - map_tiles:/usr/share/nginx/tiles:ro

  postgres:
    # PostGIS publishes linux/amd64 images only; on arm64 hosts (Apple
    # Silicon) Docker runs this under emulation.
    image: postgis/postgis:18-3.6-alpine
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-buffalo}
      POSTGRES_USER: ${DB_USERNAME:-buffalo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-buffalo}
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/.
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1: the temporary server used while init scripts run only
      # listens on the Unix socket, so this passes only once init is done.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  valkey:
    image: valkey/valkey:9.1.2-alpine3.24
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  horizon:
    <<: *app
    command: ["php", "artisan", "horizon"]
    restart: always
    stop_signal: SIGTERM
    volumes:
      - evidence_data:/var/lib/buffalo/evidence
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    restart: always
    volumes:
      - evidence_data:/var/lib/buffalo/evidence
    healthcheck:
      disable: true

  reverb:
    <<: *app
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    restart: always
    healthcheck:
      disable: true

volumes:
  postgres_data:
  valkey_data:
  evidence_data:
  map_tiles:
