# BUFFALO base services.
#
# No ports are published here. Development port bindings and source mounts
# live in compose.override.yml, which Docker Compose loads automatically.
# Every image is pinned to an exact version tag.

name: buffalo

x-app: &app
  image: buffalo-app:dev
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: dev
    args:
      UID: ${DOCKER_UID:-1000}
      GID: ${DOCKER_GID:-1000}
  depends_on:
    postgres:
      condition: service_healthy
    valkey:
      condition: service_healthy

services:
  app:
    <<: *app
    restart: unless-stopped
    networks: [default, reports]
    volumes:
      - evidence_data:/var/lib/buffalo/evidence
      - reports_data:/var/lib/buffalo/reports
    healthcheck:
      test:
        - CMD-SHELL
        - SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:1.30.5-alpine3.24
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      reverb:
        condition: service_started
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - map_tiles:/usr/share/nginx/tiles:ro

  postgres:
    # PostGIS publishes linux/amd64 images only; on arm64 hosts (Apple
    # Silicon) Docker runs this under emulation.
    image: postgis/postgis:18-3.6-alpine
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-buffalo}
      # The cluster superuser: extensions, databases and roles only (Phase 8A).
      POSTGRES_USER: ${DB_ADMIN_USERNAME:-buffalo}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:-buffalo}
      # Role passwords for docker/postgres/init/03-roles.sh (first start only).
      BUFFALO_DB_OWNER_PASSWORD: ${DB_MIGRATIONS_PASSWORD:-}
      BUFFALO_DB_APP_PASSWORD: ${DB_PASSWORD:-}
      BUFFALO_DB_READONLY_PASSWORD: ${DB_READONLY_PASSWORD:-}
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/.
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1: the temporary server used while init scripts run only
      # listens on the Unix socket, so this passes only once init is done.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  valkey:
    image: valkey/valkey:9.1.2-alpine3.24
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  horizon:
    <<: *app
    command: ["php", "artisan", "horizon"]
    restart: always
    stop_signal: SIGTERM
    networks: [default, reports]
    volumes:
      - evidence_data:/var/lib/buffalo/evidence
      - reports_data:/var/lib/buffalo/reports
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    restart: always
    volumes:
      - evidence_data:/var/lib/buffalo/evidence
      - reports_data:/var/lib/buffalo/reports
    healthcheck:
      disable: true

  reverb:
    <<: *app
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    restart: always
    healthcheck:
      disable: true

  # HTML → PDF for reports (Phase 7D). Chromium-only image (no LibreOffice).
  # Only on the internal `reports` network: no ports, no route to the
  # internet. Chromium may load only the files sent with each request
  # (written under /tmp); http(s) and every other scheme are denied.
  # Unused features are off: downloading from URLs, webhooks, the PDF engine
  # routes (merge/split/…) and metrics.
  gotenberg:
    image: gotenberg/gotenberg:8.37.0-chromium
    restart: unless-stopped
    networks: [reports]
    command:
      - gotenberg
      - --chromium-allow-list=^file:///tmp/.*
      - --chromium-deny-list=^(?!file:///tmp/).*
      - --chromium-ignore-certificate-errors=false
      - --api-disable-download-from=true
      - --webhook-disable=true
      - --pdfengines-disable-routes=true
      - --prometheus-disable-collect=true
      - --api-timeout=60s
      - --log-level=info
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  # Shared only by app, Horizon and Gotenberg. internal: true has no gateway,
  # so nothing on it can reach the outside world.
  reports:
    internal: true

volumes:
  postgres_data:
  valkey_data:
  evidence_data:
  reports_data:
  map_tiles:
