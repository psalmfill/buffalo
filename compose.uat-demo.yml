# UAT as a hosted demo (behind a host-level nginx that terminates TLS for
# DEMO_HOST): added to COMPOSE_FILE by `make uat-up DEMO_HOST=...`
# (scripts/uat/up.sh). UAT only: production never uses this file.
#
# - nginx publishes ONLY plain HTTP on 127.0.0.1:${DEMO_PORT}, served by the
#   demo server (docker/nginx/demo/demo.conf.template), which honours
#   X-Forwarded-* only from the Docker gateway. No other port is published.
# - APP_URL, REVERB_ALLOWED_ORIGINS and BUFFALO_SERVER_NAME are set from
#   DEMO_HOST in .uat/buffalo.env. Session cookies stay Secure.
services:
  nginx:
    ports: !override
      - "127.0.0.1:${DEMO_PORT:-8090}:8081"
    environment:
      BUFFALO_DEMO_GATEWAY: ${BUFFALO_DEMO_GATEWAY:-}
    volumes:
      - ./docker/nginx/demo/demo.conf.template:/etc/nginx/templates/demo.conf.template:ro
      - ./docker/nginx/demo/15-buffalo-demo-gateway.envsh:/docker-entrypoint.d/15-buffalo-demo-gateway.envsh:ro
