# Runs scripts/ci.sh. Keep all CI logic in that script; this file only
# provides PHP, Node.js and the PostgreSQL/PostGIS, Valkey and ClamAV services.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgis/postgis:18-3.6-alpine
        env:
          POSTGRES_DB: buffalo
          POSTGRES_USER: buffalo
          POSTGRES_PASSWORD: buffalo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U buffalo -d buffalo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      valkey:
        image: valkey/valkey:9.1.2-alpine3.24
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      # Malware scanning (Phase 8B.4): the image's bundled signatures; no
      # freshclam in CI.
      clamav:
        image: clamav/clamav-debian:1.5.4@sha256:9bb8712a50f0e75166e936c452cd82dd5e5be0b85586598930b5bbb84a99a578
        env:
          CLAMAV_NO_FRESHCLAMD: 'true'
        ports:
          - 3310:3310
        options: >-
          --health-cmd "clamdcheck.sh"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: buffalo
      DB_PASSWORD: buffalo
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CLAMAV_HOST: 127.0.0.1
      CLAMAV_PORT: 3310
      BUFFALO_REQUIRE_CLAMAV: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, intl, zip, gd, exif, bcmath, pcntl, redis
          tools: composer:2.10.3
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'

      - name: Run CI checks
        run: scripts/ci.sh

  # Phase 8B.7: Trivy (prod image and pinned third-party images) and an
  # authenticated OWASP ZAP scan of the stack. CI only; scripts/security-scan.sh
  # holds the logic. Reports are uploaded as an artifact.
  security:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy
        run: scripts/security-scan.sh trivy

      - name: Start the stack (built assets, no Vite dev server)
        run: |
          cp .env.example .env
          export DOCKER_UID=$(id -u) DOCKER_GID=$(id -g)
          docker compose build app
          docker compose run --rm --no-deps app composer install --no-interaction --no-progress
          docker compose run --rm --no-deps vite sh -c 'npm ci --no-audit --no-fund && npm run build'
          docker compose run --rm --no-deps app php artisan key:generate --no-interaction
          docker compose run --rm --no-deps app php artisan buffalo:encryption-key --no-interaction
          docker compose up -d --wait postgres valkey app nginx horizon clamav
          docker compose exec -T app php artisan buffalo:db:provision-roles --database=buffalo
          docker compose exec -T app php artisan migrate --force
          docker compose exec -T app php artisan db:seed --force

      - name: OWASP ZAP
        run: scripts/security-scan.sh zap

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-reports
          path: build/security
          retention-days: 30

  # Phase 8C.3: restore drill at small scale. Back up a fresh stack with
  # fixture data, restore it into an isolated project, verify; and check
  # that a wrong CIPHERSWEET_KEY is refused.
  restore-drill:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the stack with backups
        run: |
          cp .env.example .env
          export DOCKER_UID=$(id -u) DOCKER_GID=$(id -g)
          docker compose build app postgres
          docker compose run --rm --no-deps app composer install --no-interaction --no-progress
          docker compose run --rm --no-deps app php artisan key:generate --no-interaction
          docker compose run --rm --no-deps app php artisan buffalo:encryption-key --no-interaction
          docker compose up -d --wait postgres valkey app
          docker compose exec -T app php artisan buffalo:db:provision-roles --database=buffalo
          docker compose exec -T app php artisan migrate --force
          docker compose exec -T app php artisan db:seed --force
          docker compose exec -T app php artisan buffalo:keys:verify
          docker compose up -d --wait pgbackrest backup

      - name: Restore drill
        run: |
          export DOCKER_UID=$(id -u) DOCKER_GID=$(id -g)
          scripts/restore/ci-drill.sh
